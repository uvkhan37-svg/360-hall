<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall 360° Tour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
html,body,#panorama{width:100%;height:100%;margin:0;background:#111}
body{overflow:hidden;font-family:Arial,sans-serif}
.title{
 position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);
 color:#fff;background:rgba(0,0,0,.52);padding:10px 18px;border-radius:22px;
 backdrop-filter:blur(8px);font-size:15px;pointer-events:none
}
.hall-arrow{
 width:58px;height:58px;border-radius:50%;border:2px solid #fff;
 background:rgba(0,0,0,.62);color:#fff;font-size:30px;line-height:54px;
 text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.45);
 cursor:pointer;transition:.15s
}
.hall-arrow:hover{transform:scale(1.12);background:rgba(0,0,0,.82)}
.hint{
 position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);
 color:#fff;background:rgba(0,0,0,.5);padding:9px 15px;border-radius:20px;
 font-size:13px;pointer-events:none
}
</style>
</head>
<body>
<div id="panorama"></div>
<div class="title" id="title">Hall — View 1</div>
<div class="hint">Drag to look around • Scroll to zoom • Click the arrow to move</div>

<script>
const viewer = pannellum.viewer('panorama', {
  default: {
    firstScene: 'view1',
    sceneFadeDuration: 700,
    autoLoad: true,
    showControls: true,
    compass: false,
    hfov: 95
  },
  scenes: {
    view1: {
      title: 'Hall — View 1',
      type: 'equirectangular',
      panorama: 'panoramas/view1.png',
      pitch: 0,
      yaw: 0,
      hfov: 95,
      hotSpots: [{
        pitch: -8,
        yaw: 0,
        type: 'custom',
        cssClass: 'hall-arrow',
        createTooltipFunc: makeArrow,
        createTooltipArgs: {text:'→', target:'view2'}
      }]
    },
    view2: {
      title: 'Hall — View 2',
      type: 'equirectangular',
      panorama: 'panoramas/view2.png',
      pitch: 0,
      yaw: 0,
      hfov: 95,
      hotSpots: [{
        pitch: -8,
        yaw: 0,
        type: 'custom',
        cssClass: 'hall-arrow',
        createTooltipFunc: makeArrow,
        createTooltipArgs: {text:'←', target:'view1'}
      }]
    }
  }
});

function makeArrow(hotSpotDiv, args) {
  hotSpotDiv.innerHTML = args.text;
  hotSpotDiv.title = args.target === 'view2' ? 'Go to View 2' : 'Go to View 1';
  hotSpotDiv.onclick = function() {
    viewer.loadScene(args.target, 0, 0, 95);
  };
}

viewer.on('scenechange', function(id) {
  document.getElementById('title').textContent =
    id === 'view1' ? 'Hall — View 1' : 'Hall — View 2';
});
</script>
</body>
</html>
